name = "context"
kind = "md"
output = "."
include_file_names = true
roots = ["."]

[includes]
patterns = []

[excludes]
patterns = [
    "**/.git",
    "**/.gitignore",
    "**/.env",
    "**/*.dll",
    "**/*.exe",
    "**/*.so",
    "**/*.dylib",
    "**/*.o",
    "**/*.obj",
    "**/*.a",
    "**/*.lib",
    "**/context.toml",
    "**/target",
    "**/Cargo.lock",
    "**/.cargo",
]
